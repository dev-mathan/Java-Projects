<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration | Hostel Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fc;
            --dark-color: #5a5c69;
        }
        
        body {
            background-color: var(--secondary-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }
        
        .register-container {
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            overflow: hidden;
        }
        
        .register-header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        
        .register-header h2 {
            margin: 0;
            font-weight: 700;
        }
        
        .register-header p {
            margin: 0.5rem 0 0;
            opacity: 0.9;
        }
        
        .register-body {
            padding: 2rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.35rem;
            border: 1px solid #d1d3e2;
            transition: all 0.2s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.25);
        }
        
        .input-group-text {
            background-color: #f8f9fc;
            border-right: none;
            color: var(--dark-color);
        }
        
        .input-group .form-control {
            border-left: none;
        }
        
        .input-group:focus-within .input-group-text {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        
        .btn-register {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            border-radius: 0.35rem;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        
        .btn-register:hover {
            background-color: #3a5bd9;
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        
        .btn-register i {
            margin-right: 0.5rem;
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        
        .login-link a:hover {
            color: #3a5bd9;
            text-decoration: underline;
        }
        
        .register-footer {
            text-align: center;
            padding: 1rem;
            background-color: #f8f9fc;
            border-top: 1px solid #e3e6f0;
            font-size: 0.9rem;
            color: var(--dark-color);
        }
        
        .register-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        .brand-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .brand-logo i {
            font-size: 2rem;
        }
        
        .alert-success {
            background-color: #e0f3e8;
            border-color: #1cc88a;
            color: #0f6848;
            padding: 1rem;
            border-radius: 0.35rem;
            margin-top: 1rem;
            border-left: 4px solid #1cc88a;
        }
        
        .input-group {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .input-group:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        
        @media (max-width: 576px) {
            .register-body {
                padding: 1.5rem;
            }
            
            .register-header {
                padding: 1.2rem;
            }
            
            .register-header h2 {
                font-size: 1.5rem;
            }
        }
        
        /* Password toggle button styling */
        .btn-outline-secondary {
            border-color: #d1d3e2;
            background-color: #f8f9fc;
        }
        
        .btn-outline-secondary:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        
        /* Form check styling */
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .form-check-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.25);
        }
        
        /* Terms link styling */
        .text-primary {
            color: var(--primary-color) !important;
            text-decoration: none;
        }
        
        .text-primary:hover {
            color: #3a5bd9 !important;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <div class="brand-logo">
                <i class="fas fa-user-plus"></i>
            </div>
            <h2>Staff Registration</h2>
            <p>Create your staff account to access the system</p>
        </div>
        
        <div class="register-body">
            <form th:action="@{/staff/register}" th:object="${staff}" method="post">
                <!-- Full Name Field -->
                <div class="mb-3">
                    <label for="name" class="form-label">
                        <i class="fas fa-user-circle me-2"></i>Full Name
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" 
                               class="form-control" 
                               id="name" 
                               th:field="*{name}" 
                               placeholder="Enter your full name" 
                               required>
                    </div>
                </div>
                
                <!-- Email Field -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope me-2"></i>Email Address
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" 
                               class="form-control" 
                               id="email" 
                               th:field="*{email}" 
                               placeholder="Enter your email address" 
                               required>
                    </div>
                </div>
                
                <!-- Mobile Field -->
                <div class="mb-3">
                    <label for="mobile" class="form-label">
                        <i class="fas fa-phone-alt me-2"></i>Mobile Number
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-mobile-alt"></i></span>
                        <input type="text" 
                               class="form-control" 
                               id="mobile" 
                               th:field="*{mobile}" 
                               placeholder="Enter your mobile number" 
                               required>
                    </div>
                </div>
                <!-- Department Field -->
<div class="mb-3">
    <label for="department" class="form-label">
        <i class="fas fa-building me-2"></i>Department
    </label>
    <div class="input-group">
        <span class="input-group-text">
            <i class="fas fa-sitemap"></i>
        </span>
        <input type="text"
               class="form-control"
               id="department"
               th:field="*{department}"
               placeholder="Enter your department"
               required>
    </div>
</div>
                
                
                <!-- Password Field -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock me-2"></i>Password
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-key"></i></span>
                        <input type="password" 
                               class="form-control" 
                               id="password" 
                               th:field="*{password}" 
                               placeholder="Create a password" 
                               required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Role Field -->
                <div class="mb-3">
                    <label for="role" class="form-label">
                        <i class="fas fa-briefcase me-2"></i>Role
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user-tag"></i></span>
                        <input type="text" 
                               class="form-control" 
                               id="role" 
                               th:field="*{role}" 
                               placeholder="Enter your role (e.g., Manager, Staff)" 
                               required>
                    </div>
                </div>
                
                
                <!-- Terms and Conditions Checkbox -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="termsCheck" required>
                    <label class="form-check-label" for="termsCheck">
                        I agree to the <a href="#" class="text-primary">Terms and Conditions</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-register">
                    <i class="fas fa-user-plus"></i> Register Account
                </button>
                
                <!-- Success message -->
                <div th:if="${msg}" class="alert-success" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${msg}"></span>
                </div>
                
                <!-- Error message (if needed) -->
                <div th:if="${error}" class="alert alert-danger mt-3" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">Registration failed. Please try again.</span>
                </div>
            </form>
            
            <div class="login-link">
                Already have an account? <a th:href="@{/staff/login}">Login here</a>
            </div>
        </div>
        
        <div class="register-footer">
            <i class="fas fa-shield-alt me-2"></i>Secure Registration • <a href="/">Back to Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Add animation to form elements (matching login page)
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.closest('.input-group').style.transform = 'translateY(-2px)';
                this.closest('.input-group').style.boxShadow = '0 0.5rem 1rem rgba(0, 0, 0, 0.1)';
            });
            
            input.addEventListener('blur', function() {
                this.closest('.input-group').style.transform = '';
                this.closest('.input-group').style.boxShadow = '';
            });
        });
        
        // Form validation styling (optional)
        (function() {
            'use strict';
            
            const forms = document.querySelectorAll('form');
            
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
