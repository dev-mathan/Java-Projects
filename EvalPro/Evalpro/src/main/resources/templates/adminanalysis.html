<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Marks Analysis</title>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial;
            background: #f9fafb;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            padding: 25px;
            border-radius: 15px;
            background: #fff8e1;
            text-align: center;
            border-left: 5px solid #ffc107;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
            margin-top: 10px;
        }

        .label {
            font-size: 16px;
            color: #555;
        }

        .chart-container {
            margin: 40px 0;
            padding: 20px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .chart-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .stats-summary {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffc107;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .back-btn {
            margin-top: 30px;
            text-align: center;
        }

        .back-btn a {
            padding: 10px 25px;
            background: #ffc107;
            text-decoration: none;
            color: black;
            font-weight: bold;
            border-radius: 10px;
            transition: background 0.3s;
        }

        .back-btn a:hover {
            background: #e0a800;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>📊 Student Marks Analysis</h2>

    <div class="analysis-grid">

        <div class="card">
            <div class="label">Total Exams</div>
            <div class="value" th:text="${marksList.size()}">0</div>
        </div>

        <div class="card">
            <div class="label">Average Percentage</div>
            <div class="value"
                 th:text="${averagePercentage != null} ? ${averagePercentage} + '%' : '0%'">
                0%
            </div>
        </div>

        <div class="card">
            <div class="label">Pass Count</div>
            <div class="value"
                 th:text="${passCount} + '/' + ${marksList.size()}">
                0/0
            </div>
        </div>

        <div class="card">
            <div class="label">Pass Percentage</div>
            <div class="value"
                 th:text="${passPercentage != null} ? ${passPercentage} + '%' : '0%'">
                0%
            </div>
        </div>

        <div class="card">
            <div class="label">Highest Score</div>
            <div class="value"
                 th:text="${highestScore != null} ? ${highestScore} : 0">
                0
            </div>
        </div>

    </div>

    <!-- New Chart Section -->
    <div class="chart-container">
        <div class="chart-title">📈 Student Result Distribution Analysis</div>
        <canvas id="resultChart" style="width:100%; max-height:400px;"></canvas>
        
        <!-- Additional Stats Summary -->
        <div class="stats-summary">
            <div class="stat-item">
                <div class="stat-value" th:text="${passCount}">0</div>
                <div class="stat-label">Passed Students</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" th:text="${marksList.size() - passCount}">0</div>
                <div class="stat-label">Failed Students</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" th:text="${distinctionCount != null ? distinctionCount : 0}">0</div>
                <div class="stat-label">Distinctions (75%+)</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" th:text="${firstClassCount != null ? firstClassCount : 0}">0</div>
                <div class="stat-label">First Class (60-74%)</div>
            </div>
        </div>
    </div>

    <div class="back-btn">
        <a href="/admin/back1">← Back to Marks List</a>
    </div>

</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    
    // Get data from Thymeleaf
    var marksList = /*[[${marksList}]]*/ [];
    var passCount = /*[[${passCount}]]*/ 0;
    var distinctionCount = /*[[${distinctionCount}]]*/ 0;
    var firstClassCount = /*[[${firstClassCount}]]*/ 0;
    var passPercentage = /*[[${passPercentage}]]*/ 0;
    
    // Calculate additional metrics if not provided by backend
    var totalStudents = marksList.length;
    var failCount = totalStudents - passCount;
    
    // Calculate grade distribution
    var distinctionCount = distinctionCount || 0;
    var firstClassCount = firstClassCount || 0;
    var passClassCount = 0;
    var failCount = 0;
    
    // If marksList has data, calculate distribution
    if (marksList && marksList.length > 0) {
        // Reset counts to calculate from actual data
        distinctionCount = 0;
        firstClassCount = 0;
        passClassCount = 0;
        failCount = 0;
        
        marksList.forEach(function(marks) {
            var percentage = marks.percentage || 0;
            
            if (percentage >= 75) {
                distinctionCount++;
            } else if (percentage >= 60) {
                firstClassCount++;
            } else if (percentage >= 35) { // Assuming 35% is pass mark
                passClassCount++;
            } else {
                failCount++;
            }
        });
    }
    
    // Create the chart
    document.addEventListener('DOMContentLoaded', function() {
        var ctx = document.getElementById('resultChart').getContext('2d');
        
        // Grade distribution chart
        var chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Distinction (75%+)', 'First Class (60-74%)', 'Pass Class (35-59%)', 'Fail (<35%)'],
                datasets: [{
                    label: 'Number of Students',
                    data: [distinctionCount, firstClassCount, passClassCount, failCount],
                    backgroundColor: [
                        'rgba(40, 167, 69, 0.7)',   // Green for distinction
                        'rgba(23, 162, 184, 0.7)',  // Blue for first class
                        'rgba(255, 193, 7, 0.7)',   // Yellow for pass
                        'rgba(220, 53, 69, 0.7)'    // Red for fail
                    ],
                    borderColor: [
                        'rgba(40, 167, 69, 1)',
                        'rgba(23, 162, 184, 1)',
                        'rgba(255, 193, 7, 1)',
                        'rgba(220, 53, 69, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    title: {
                        display: true,
                        text: 'Student Performance Distribution',
                        font: {
                            size: 16
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        },
                        title: {
                            display: true,
                            text: 'Number of Students'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Grade Categories'
                        }
                    }
                }
            }
        });
        
        // Optional: Add a second chart for pass/fail ratio (pie chart)
        var ctx2 = document.getElementById('passFailChart');
        if (ctx2) {
            new Chart(ctx2, {
                type: 'pie',
                data: {
                    labels: ['Pass', 'Fail'],
                    datasets: [{
                        data: [passCount, failCount],
                        backgroundColor: [
                            'rgba(40, 167, 69, 0.7)',
                            'rgba(220, 53, 69, 0.7)'
                        ],
                        borderColor: [
                            'rgba(40, 167, 69, 1)',
                            'rgba(220, 53, 69, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Pass vs Fail Ratio'
                        }
                    }
                }
            });
        }
    });
    
    /*]]>*/
</script>

<!-- Add this if you want to include a second chart -->
<div class="chart-container" style="margin-top: 20px;">
    <div class="chart-title">🥧 Pass vs Fail Distribution</div>
    <canvas id="passFailChart" style="width:100%; max-height:300px;"></canvas>
</div>

</body>
</html>
