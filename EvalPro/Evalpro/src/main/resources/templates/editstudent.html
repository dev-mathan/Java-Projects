<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 30px;
            margin-bottom: 30px;
            max-width: 900px;
        }
        h2 {
            color: #343a40;
            font-weight: 600;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .form-label {
            font-weight: 500;
            color: #495057;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #ced4da;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
            padding: 10px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
            transform: translateY(-2px);
        }
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
            padding: 10px 25px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .input-group-text {
            background-color: #e9ecef;
            border-radius: 8px 0 0 8px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .form-section {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #495057;
            margin-bottom: 15px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="header-container">
        <h2><i class="fas fa-user-edit text-primary me-2"></i>Edit Student</h2>
        <a href="/admin/students" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i> Back to List
        </a>
    </div>

    <form th:action="@{/admin/students/update}" method="post">
        <input type="hidden" name="studentId" th:value="${student.studentId}" />

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-user-circle me-2"></i>Basic Information</div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="firstName" class="form-label">First Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="firstName" name="firstName" 
                               th:value="${student.firstName}" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" 
                               th:value="${student.email}" required>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        <input type="text" class="form-control" id="phone" name="phone" 
                               th:value="${student.phone}" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="dob" class="form-label">Date of Birth</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-calendar-alt"></i></span>
                        <input type="date" class="form-control" id="dob" name="dob" 
                               th:value="${student.dob}" required>
                    </div>
                </div>
            </div>

            <div class="mb-3">
				<label for="gender" class="form-label">Gender</label>
				   <select class="form-select" id="gender" name="gender" disabled>
				       <option value="">Select Gender</option>
				       <option value="Male" th:selected="${#strings.equalsIgnoreCase(student.gender, 'Male')}">Male</option>
				       <option value="Female" th:selected="${#strings.equalsIgnoreCase(student.gender, 'Female')}">Female</option>
				       <option value="Other" th:selected="${#strings.equalsIgnoreCase(student.gender, 'Other')}">Other</option>
				   </select>
				   <input type="hidden" name="gender" th:value="${student.gender}" />
            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-graduation-cap me-2"></i>Academic Information</div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="university" class="form-label">University</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-university"></i></span>
                        <input type="text" class="form-control" id="university" name="university" 
                               th:value="${student.university}" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="course" class="form-label">Course</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-book"></i></span>
                        <input type="text" class="form-control" id="course" name="course" 
                               th:value="${student.course}" required>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="year" class="form-label">Year</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                    <input type="number" class="form-control" id="year" name="year" 
                           th:value="${student.year}" required min="1">
                </div>
            </div>
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save me-2"></i> Update Student
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
