<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Hostel Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fc;
            --dark-color: #5a5c69;
        }
        
        body {
            background-color: var(--secondary-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .login-container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            overflow: hidden;
        }
        
        .login-header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        
        .login-header h2 {
            margin: 0;
            font-weight: 700;
        }
        
        .login-header p {
            margin: 0.5rem 0 0;
            opacity: 0.9;
        }
        
        .login-body {
            padding: 2rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.35rem;
            border: 1px solid #d1d3e2;
            width: 100%;
            box-sizing: border-box;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.25);
            outline: none;
        }
        
        .btn-login {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            border-radius: 0.35rem;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-login:hover {
            background-color: #3a5bd9;
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        
        .brand-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .brand-logo i {
            font-size: 2rem;
        }
        
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .input-icon {
            position: absolute;
            left: 1rem;
            color: var(--dark-color);
            z-index: 1;
        }
        
        .input-group .form-control {
            padding-left: 2.8rem;
        }
        
        .input-group:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        
        .input-group:focus-within .input-icon {
            color: var(--primary-color);
        }
        
        .error-message {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 1rem;
            border-radius: 0.35rem;
            margin-top: 1rem;
            border-left: 4px solid #dc3545;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .error-message i {
            font-size: 1.1rem;
        }
        
        .login-footer {
            text-align: center;
            padding: 1rem;
            background-color: #f8f9fc;
            border-top: 1px solid #e3e6f0;
            font-size: 0.9rem;
            color: var(--dark-color);
        }
        
        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .field-spacing {
            margin-bottom: 1.5rem;
        }
        
        @media (max-width: 576px) {
            .login-body {
                padding: 1.5rem;
            }
            
            .login-header {
                padding: 1.2rem;
            }
            
            .login-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="brand-logo">
                <i class="fas fa-chalkboard-teacher"></i>
            </div>
            <h2>Staff Portal</h2>
            <p>Access your staff dashboard and manage students</p>
        </div>
        
        <div class="login-body">
            <!-- Your exact form with same backend structure -->
            <form th:action="@{/staff/login}" method="post">
                <!-- Email Field -->
                <div class="field-spacing">
                    <label class="form-label">
                        <i class="fas fa-envelope me-2"></i>Email
                    </label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="email" 
                               class="form-control" 
                               name="email" 
                               placeholder="Enter your email address" 
                               required>
                    </div>
                </div>
                
                <!-- Password Field -->
                <div class="field-spacing">
                    <label class="form-label">
                        <i class="fas fa-lock me-2"></i>Password
                    </label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-key"></i></span>
                        <input type="password" 
                               class="form-control" 
                               name="password" 
                               placeholder="Enter your password" 
                               required>
                    </div>
                </div>
                
                <!-- Department Field -->
                <div class="field-spacing">
                    <label class="form-label">
                        <i class="fas fa-building me-2"></i>Department
                    </label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-sitemap"></i></span>
                        <input type="text" 
                               class="form-control" 
                               name="department" 
                               placeholder="Enter your department" 
                               required>
                    </div>
                </div>
                
                <!-- Login Button -->
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i> Login to Dashboard
                </button>
                
                <!-- Error message display - exactly as your code -->
                <p style="color:red;" class="error-message" th:if="${errorMessage != null}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:text="${errorMessage}"></span>
                </p>
            </form>
        </div>
        
        <div class="login-footer">
            <i class="fas fa-user-plus me-2"></i>Don't have an account? 
            <a th:href="@{/register}">Register here</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Add animation to form inputs
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.closest('.input-group').style.transform = 'translateY(-2px)';
                this.closest('.input-group').style.boxShadow = '0 0.5rem 1rem rgba(0, 0, 0, 0.1)';
            });
            
            input.addEventListener('blur', function() {
                this.closest('.input-group').style.transform = '';
                this.closest('.input-group').style.boxShadow = '';
            });
        });
    </script>
</body>
</html>
