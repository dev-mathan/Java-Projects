<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Exam Result | Student Portal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .result-card {
            width: 550px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            backdrop-filter: blur(10px);
            animation: slideIn 0.6s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #333;
            font-size: 36px;
            margin-bottom: 30px;
            font-weight: 600;
            position: relative;
            padding-bottom: 15px;
        }

        h2:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(to right, #667eea, #764ba2);
            border-radius: 2px;
        }

        .score-badge {
            background: linear-gradient(135deg, #667eea15, #764ba215);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px dashed #667eea40;
        }

        .score-badge p {
            margin: 10px 0;
        }

        .score-badge strong {
            color: #555;
            font-size: 16px;
            font-weight: 500;
            display: inline-block;
            min-width: 100px;
        }

        .score-badge span {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            background: white;
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-left: 10px;
        }

        .percentage-text {
            font-size: 18px;
            color: #555;
            margin: 15px 0 5px;
        }

        .percentage-text span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 600;
            margin-left: 10px;
        }

        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 30px;
            height: 30px;
            margin: 20px 0 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .progress-bar {
            height: 30px;
            border-radius: 30px;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            text-align: center;
            color: white;
            font-weight: bold;
            line-height: 30px;
            font-size: 14px;
            transition: width 1s ease-in-out;
            position: relative;
            z-index: 1;
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.4);
        }

        .progress-bar.fail {
            background: linear-gradient(90deg, #f44336, #ff6b6b);
            box-shadow: 0 2px 10px rgba(244, 67, 54, 0.4);
        }

        .status-badge {
            margin: 30px 0 25px;
            padding: 20px;
            border-radius: 15px;
            background: #f8f9fa;
            border-left: 5px solid;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1);
            }
        }

        .status-badge.pass {
            border-left-color: #4CAF50;
            background: linear-gradient(135deg, #4CAF5010, #8BC34A10);
        }

        .status-badge.fail {
            border-left-color: #f44336;
            background: linear-gradient(135deg, #f4433610, #ff6b6b10);
        }

        .status-badge strong {
            font-size: 16px;
            color: #555;
            font-weight: 500;
        }

        .status-badge span {
            font-size: 24px;
            font-weight: 700;
            margin-left: 15px;
        }

        .status-badge.pass span {
            color: #4CAF50;
        }

        .status-badge.fail span {
            color: #f44336;
        }

        .btn {
            margin-top: 20px;
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            width: auto;
            min-width: 200px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
            background: linear-gradient(to right, #5a6fd8, #6845a0);
        }

        .btn:active {
            transform: translateY(0);
        }

        .emoji-decoration {
            font-size: 24px;
            margin: 0 5px;
        }

        .score-detail {
            display: flex;
            justify-content: space-around;
            margin: 25px 0 15px;
            padding: 15px 0;
            border-top: 2px dashed #e0e0e0;
            border-bottom: 2px dashed #e0e0e0;
        }

        .score-detail-item {
            text-align: center;
        }

        .score-detail-item .label {
            font-size: 14px;
            color: #777;
            margin-bottom: 5px;
        }

        .score-detail-item .value {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>

<div class="result-card">

    <h2>📊 Exam Result</h2>

    <div class="score-badge">
        <p>
            <strong>🎯 Score:</strong>
            <span th:text="${score}"></span> / <span th:text="${total}"></span>
        </p>

        <p class="percentage-text">
            <strong>📈 Percentage:</strong>
            <span th:text="${total > 0 ? (score * 100 / total) : 0}"></span>%
        </p>
    </div>

    <!-- Progress Bar with your exact logic -->
    <div class="progress-container">
        <div class="progress-bar"
             th:classappend="${(score * 100 / total) < 40} ? ' fail' : ''"
             th:style="|width:${total > 0 ? (score * 100 / total) : 0}%|"
             th:text="${total > 0 ? (score * 100 / total) : 0} + '%'">
        </div>
    </div>

    <!-- Score Details -->
    <div class="score-detail">
        <div class="score-detail-item">
            <div class="label">✅ Correct</div>
            <div class="value" th:text="${score}"></div>
        </div>
        <div class="score-detail-item">
            <div class="label">❌ Incorrect</div>
            <div class="value" th:text="${total - score}"></div>
        </div>
        <div class="score-detail-item">
            <div class="label">🎯 Required</div>
            <div class="value" th:text="${total * 40 / 100} + ' (' + 40 + '%)'"></div>
        </div>
    </div>

    <!-- Status with your exact logic -->
    <div class="status-badge"
         th:classappend="${(score * 100 / total) >= 40} ? 'pass' : 'fail'">
        <strong>📋 Final Status:</strong>
        <span th:text="${(score * 100 / total) >= 40} ? 'PASSED 🎉' : 'FAILED 💪'"></span>
        <div style="font-size: 14px; color: #666; margin-top: 8px;"
             th:text="${(score * 100 / total) >= 40} ? 'Congratulations on passing the exam!' : 'Better luck next time! Keep practicing'">
        </div>
    </div>

    <!-- Your exact form with enhanced button -->
 
<a th:href="@{/student/home}" class="btn">
    <span class="emoji-decoration">🏠</span> Back to Dashboard
</a>

    <!-- Small decorative text -->
    <div style="margin-top: 20px; font-size: 12px; color: #999;">
        <span th:text="${new java.util.Date().getYear() + 1900}"></span> © Student Portal
    </div>

</div>

</body>
</html>
