<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Registered Students</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h2 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .table-wrapper {
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin: 20px 0;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
            padding: 15px;
            position: relative;
        }

        th:first-child {
            border-radius: 10px 0 0 10px;
        }

        th:last-child {
            border-radius: 0 10px 10px 0;
        }

        td {
            background-color: #f8f9fa;
            padding: 15px;
            color: #333;
            font-size: 0.95em;
            transition: all 0.3s ease;
            border: none;
        }

        tr:hover td {
            background-color: #e9ecef;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        td:first-child {
            border-radius: 10px 0 0 10px;
            font-weight: 600;
            color: #667eea;
        }

        td:last-child {
            border-radius: 0 10px 10px 0;
        }

        .button-container {
            padding: 20px 30px 30px 30px;
            text-align: left;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1em;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            border: none;
            cursor: pointer;
        }

        .back-button:hover {
            transform: translateX(-5px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .back-button::before {
            content: "←";
            margin-right: 10px;
            font-size: 1.2em;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .back-button:hover::before {
            transform: translateX(-5px);
        }

        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            display: inline-block;
            margin: 0 30px 20px 30px;
            font-size: 1.1em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .stats-card span {
            font-weight: bold;
            font-size: 1.3em;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .header h2 {
                font-size: 1.8em;
            }
            
            th, td {
                padding: 10px;
                font-size: 0.85em;
            }
            
            .stats-card {
                display: block;
                text-align: center;
                margin: 0 15px 20px 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>All Registered Students</h2>
        <p>Complete list of students enrolled in the system</p>
    </div>

    <!-- Statistics Card (Optional - shows total students) -->
    <div class="stats-card" th:if="${students != null}">
        Total Students: <span th:text="${#lists.size(students)}"></span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Year</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}" th:attr="data-id=${student.id}">
                    <td th:text="${student.id}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.email}"></td>
                    <td th:text="${student.department}"></td>
                    <td th:text="${student.year}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="button-container">
        <a href="javascript:history.back()" class="back-button">Back to Previous Page</a>
    </div>
</div>

</body>
</html>
