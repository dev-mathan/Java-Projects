<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Results</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 30px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Student Result List</h2>

<table>
    <tr>
        <th>Student Name</th>
        <th>Email</th>
        <th>Score</th>
        <th>Total</th>
        <th>Exam Date</th>
    </tr>

    <tr th:each="r : ${results}">
        <td th:text="${r.student.name}"></td>
        <td th:text="${r.student.email}"></td>
        <td th:text="${r.score}"></td>
        <td th:text="${r.total}"></td>
        <td th:text="${r.examDate}"></td>
    </tr>

</table>

</body>
</html>
