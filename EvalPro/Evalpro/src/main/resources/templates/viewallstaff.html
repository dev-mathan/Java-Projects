<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Registered Staff</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Font for a modern, clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <!-- Font Awesome icons (optional but adds nice touch) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            line-height: 1.5;
            color: #1e293b;
        }

        .staff-container {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            padding: 2rem 2rem 2.5rem 2rem;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        /* Header area with title + back button */
        .header-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-group i {
            font-size: 2rem;
            color: #2563eb;
            background: #e6f0ff;
            padding: 12px;
            border-radius: 18px;
        }

        h2 {
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: -0.02em;
            background: linear-gradient(145deg, #0f2b5e, #1e40af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1.2;
        }

        .sub-head {
            color: #5f6b7a;
            margin-top: 4px;
            font-size: 0.95rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sub-head i {
            font-size: 0.8rem;
            color: #3b82f6;
            background: transparent;
            padding: 0;
        }

        /* Back button – elegant, no backend logic */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: white;
            padding: 0.85rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: #1e293b;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0, 27, 65, 0.1);
            border: 1px solid #dde3ed;
            transition: 0.2s ease;
            letter-spacing: -0.01em;
        }

        .btn-back i {
            font-size: 1.2rem;
            color: #2563eb;
            transition: transform 0.15s ease;
        }

        .btn-back:hover {
            background: #f8fafd;
            border-color: #2563eb;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.15);
            transform: scale(1.02);
        }

        .btn-back:hover i {
            transform: translateX(-5px);
        }

        /* elegant stat summary (no backend, just UI flourish) */
        .summary-line {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #4b5a6e;
        }

        .summary-line span {
            background: #eef2f8;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .summary-line i {
            color: #2563eb;
            font-size: 1rem;
        }

        /* ---------- MODERN TABLE DESIGN (card-like) ---------- */
        .staff-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
            margin: 0.5rem 0 0.25rem;
        }

        .staff-table thead th {
            background: transparent;
            color: #52637b;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 0 1rem 0.75rem 1rem;
            text-align: left;
            border-bottom: 2px solid #cfddee;
        }

        /* align table header cells with body (left-align) */
        .staff-table th,
        .staff-table td {
            padding: 1rem 1rem;
            text-align: left;
            vertical-align: middle;
        }

        /* first column (ID) – slightly smaller width hint, but no fixed */
        .staff-table tbody tr {
            background: white;
            border-radius: 24px;
            box-shadow: 0 6px 14px rgba(0,20,40,0.06), 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
            cursor: default;
        }

        .staff-table tbody tr:hover {
            box-shadow: 0 16px 30px -8px rgba(37, 99, 235, 0.15);
            background: #ffffff;
            transform: scale(1.002);
        }

        .staff-table td {
            background: white;
            font-size: 1rem;
            font-weight: 500;
            color: #1e2c44;
            border: none;
            white-space: nowrap;
        }

        /* first td (ID) styling – subtle */
        .staff-table td:first-child {
            font-weight: 600;
            color: #2563eb;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            padding-left: 1.5rem;
        }

        .staff-table td:last-child {
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
            padding-right: 1.5rem;
        }

        /* Department with subtle tag style */
        .dept-tag {
            background: #eaf3ff;
            color: #1d4ed8;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-block;
            transition: 0.1s;
        }

        .staff-table tr:hover .dept-tag {
            background: #d4e3ff;
        }

        /* mobile number style */
        .mobile-number {
            font-feature-settings: "tnum";
            font-weight: 500;
            color: #2c3e5c;
            letter-spacing: 0.2px;
        }

        /* email style */
        .email-cell {
            color: #3b4e6b;
            font-weight: 450;
            font-size: 0.95rem;
            border-bottom: 1px dashed #a5c0e0;
            cursor: default;
        }

        /* subtle divider adjustment */
        .staff-table tbody tr td {
            border-top: 1px solid transparent;
            border-bottom: 1px solid transparent;
        }

        /* extra small icon for each row (optional, but adds UI richness) */
        .staff-table tbody tr td:first-child::before {
            content: "👤";
            margin-right: 8px;
            font-size: 0.9rem;
            opacity: 0.8;
            filter: grayscale(0.2);
        }

        /* keep nice empty state? Not needed as th:each will generate rows, but if list empty we still show headers—no problem */

        /* footer / hint (just UI) */
        .table-footer-note {
            display: flex;
            justify-content: flex-end;
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #6a7b8c;
            gap: 12px;
            border-top: 1px solid #e2eaf5;
            padding-top: 1.5rem;
        }

        .table-footer-note i {
            color: #2563eb;
        }

        /* responsive: allow scroll on small screens */
        @media (max-width: 700px) {
            .staff-container {
                padding: 1.5rem 1rem;
            }
            .header-section {
                flex-direction: column;
                align-items: flex-start;
            }
            .staff-table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
                border-spacing: 0 8px;
            }
            .staff-table td {
                white-space: nowrap;
            }
            .btn-back {
                width: 100%;
                justify-content: center;
            }
        }

        /* little extra polish for th icons */
        .staff-table th i {
            margin-right: 6px;
            font-size: 0.9rem;
            color: #3b6cb7;
            opacity: 0.8;
        }

        /* no changes to backend, everything ui only */
    </style>
</head>
<body>
<div class="staff-container">
    <!-- Header with Back button (no backend, pure ui) -->
    <div class="header-section">
        <div class="title-group">
            <i class="fas fa-users-cog"></i>
            <div>
                <h2>Staff directory</h2>
                <div class="sub-head">
                    <i class="fas fa-check-circle"></i>
                    <span th:text="'Total ' + ${#lists.size(staffList)} + ' registered'">Total 0 registered</span>
                    <!-- above uses thymeleaf to show count, purely presentational, no backend logic change -->
                </div>
            </div>
        </div>
        <!-- BACK BUTTON (just a link – put your dashboard URL, e.g. "/dashboard" or "#" -->
        <!-- It does not affect backend, only markup. Use javascript:history or a relative link as you wish -->
        <a href="#" onclick="history.back();  false;" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Dashboard</span>
            <i class="fas fa-chevron-right" style="opacity:0.4; font-size:0.9rem;"></i>
        </a>
        <!-- The onclick uses history.back() which is client-side, zero backend involvement. Or you can replace href with your dashboard route. Compatible with thymeleaf -->
    </div>

    <!-- small summary / hint (pure ui) -->
    <div class="summary-line" th:unless="${#lists.isEmpty(staffList)}">
        <span><i class="fas fa-circle-check"></i> active staff members · last updated today</span>
    </div>

    <!-- MAIN TABLE - your exact thymeleaf loop, only classes added, no structural change -->
    <table class="staff-table">
        <thead>
        <tr>
            <th><i class="fas fa-id-card"></i> ID</th>
            <th><i class="fas fa-user-tie"></i> Name</th>
            <th><i class="fas fa-envelope"></i> Email</th>
            <th><i class="fas fa-building"></i> Department</th>
            <th><i class="fas fa-phone-alt"></i> Mobile</th>
        </tr>
        </thead>
        <tbody>
        <!-- exactly your original loop, with added classes on td for extra styling -->
        <tr th:each="staff : ${staffList}">
            <td th:text="${staff.id}" class="id-cell"></td>
            <td th:text="${staff.name}" class="name-cell"></td>
            <td th:text="${staff.email}" class="email-cell"></td>
            <td>
                <!-- keep content same, but wrapped in span for visual tag -->
                <span class="dept-tag" th:text="${staff.department}">Engineering</span>
            </td>
            <td th:text="${staff.mobile}" class="mobile-number"></td>
        </tr>
        <!-- optional message if list empty (but not modifying any backend data) -->
        <tr th:if="${#lists.isEmpty(staffList)}">
            <td colspan="5" style="text-align: center; padding: 3rem; background: transparent; box-shadow: none; border-radius: 40px; color: #778da0; font-weight: 500;">
                <i class="fas fa-folder-open" style="font-size:2rem; opacity:0.5; margin-bottom:0.5rem; display:block;"></i>
                No staff members found
            </td>
        </tr>
        </tbody>
    </table>

    <!-- subtle footer (UI only) -->
    <div class="table-footer-note">
        <i class="fas fa-shield-alt"></i>
        <span>secure directory · updated in real-time</span>
    </div>
</div>

<!-- Absolutely zero backend code modifications, just CSS & structure for attractiveness.
     Back button uses history.back() which is client-side; you can replace href with actual dashboard path.  -->
</body>
</html>
