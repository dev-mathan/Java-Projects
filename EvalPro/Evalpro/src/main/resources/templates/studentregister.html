<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | EduAssess AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- global design tokens (matching student login page) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b5b9b;          /* refined slate-blue */
            --primary-dark: #2c4a7a;
            --secondary: #42a5c5;         /* fresh teal */
            --accent: #f7b731;             /* warm amber */
            --dark: #1a2639;
            --dark-2: #2d3a5e;
            --light: #f4f7fc;
            --light-2: #e9eef4;
            --shadow-card: 0 20px 30px -10px rgba(26, 38, 57, 0.15);
            --radius-card: 1.2rem;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
        }

        /* ----- header with gradient/pattern (matches student login) ----- */
        .header {
            background: radial-gradient(ellipse at 80% 30%, #334e77, #121e30);
            position: relative;
            padding: 48px 0 48px;
            text-align: center;
            overflow: hidden;
        }

        .header::after {
            content: "";
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cGF0aCBkPSJNMjAgMjBhMTAgMTAgMCAwIDEgMTAgMTAgMTAgMTAgMCAwIDEtMTAgMTAgMTAgMTAgMCAwIDEtMTAtMTAgMTAgMTAgMCAwIDEgMTAtMTB6IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDMiLz48L3N2Zz4=') repeat;
            opacity: 0.2;
            pointer-events: none;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .logo-icon {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .logo-title {
            font-size: 26px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .logo-subtitle {
            font-size: 12px;
            color: #b6c9e4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 600;
            color: white;
            margin-top: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
        }

        /* ----- registration section – card style (exactly like login) ----- */
        .registration-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            background: var(--light);
        }

        .form-container {
            background: white;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 48px 44px;
            width: 100%;
            max-width: 600px;        /* comfortable for single column */
            border: 1px solid #eef3fd;
            position: relative;
            overflow: hidden;
        }

        .form-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .form-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .form-header h2 {
            font-size: 32px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 10px;
            font-family: 'Poppins', 'Inter', sans-serif;
        }

        .form-header p {
            color: #4a5578;
            font-size: 16px;
        }

        /* ----- form styling – matches login input style exactly ----- */
        .registration-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-2);
            font-size: 15px;
        }

     

        input, select {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--light-2);
            border-radius: 60px;               /* pill shape like login */
            font-size: 16px;
            background: white;
            transition: 0.2s;
            color: var(--dark);
            font-weight: 400;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 91, 155, 0.1);
        }

        /* button – identical to login page button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            background: var(--primary);
            color: white;
            box-shadow: 0 12px 28px -8px #1e2f4b;
            width: 100%;
            margin-top: 16px;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 24px 36px -10px #0c1729;
        }

        .btn i {
            font-size: 18px;
        }

        /* footer link (already have account) */
        .form-footer {
            text-align: center;
            margin-top: 28px;
        }

        .form-footer p {
            color: #4a5578;
            font-size: 15px;
        }

        .form-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            margin-left: 6px;
        }

        .form-footer a:hover {
            border-bottom-color: var(--primary);
        }

        /* social login (optional, but matches login page – we can keep it consistent) */
        .social-login {
            margin: 30px 0 10px;
            text-align: center;
        }

        .social-login p {
            color: #6b7a9e;
            margin-bottom: 20px;
            position: relative;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .social-login p::before,
        .social-login p::after {
            content: "";
            display: inline-block;
            width: 28%;
            height: 1px;
            background: #d7e0ec;
            position: relative;
            vertical-align: middle;
            margin: 0 10px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            width: 48px;
            height: 48px;
            border-radius: 30px;
            background: #edf2f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 20px;
            transition: 0.2s;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .social-icon:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-4px);
            box-shadow: 0 10px 18px -8px var(--primary);
        }

        @media (max-width: 500px) {
            .form-container {
                padding: 36px 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Header – exactly like studentlogin.html (EduAssess AI branding) -->
    <header class="header">
        <div class="container">
            <a href="#" class="logo">
                <div class="logo-icon"><i class="fas fa-brain"></i></div>
                <div class="logo-text">
                    <div class="logo-title">EduAssess AI</div>
                    <div class="logo-subtitle">exam · insight · adaptive</div>
                </div>
            </a>
            <h1 class="page-title">Student Portal</h1>
        </div>
    </header>

    <!-- Registration Section – all your Thymeleaf attributes preserved exactly -->
    <section class="registration-section">
        <div class="form-container">
            <div class="form-header">
                <h2>Create Account</h2>
                <p>Join the AI-powered learning ecosystem</p>
            </div>

            <!-- YOUR EXACT THYMELEAF CODE – only UI classes added, backend untouched -->
            <form class="registration-form" 
                  th:action="@{/student/register}" 
                  th:object="${student}" 
                  method="post">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" th:field="*{name}" required />
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" required />
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text" th:field="*{department}" required />
                </div>

                <div class="form-group">
                    <label>Year</label>
                    <input type="text" th:field="*{year}" required />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" th:field="*{password}" required />
                </div>

                <button type="submit" class="btn">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </form>

            <!-- Optional social login (matches login page style) -->
            <div class="social-login">
                <p>or register with</p>
                <div class="social-icons">
                    <a href="#" class="social-icon"><i class="fab fa-google"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-github"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>

            <div class="form-footer">
                <p>Already have an account? <a href="/studentlogin">Sign in</a></p>
            </div>
        </div>
    </section>

</body>
</html>
