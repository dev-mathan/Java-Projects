
services:
  postgres:
    image: postgres:16
    container_name: nimbus-postgres
    environment:
      POSTGRES_DB: nimbusvault
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: nimbus-minio:local
    container_name: nimbus-minio
    entrypoint: ["/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: nimbus
      MINIO_ROOT_PASSWORD: nimbus@123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nimbus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nimbusvault.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  miniodata:
  pgadmin_data:
